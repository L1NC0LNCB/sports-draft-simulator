<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Temporada - Basquete - SportsBar</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230b0e14'/%3E%3Cpath fill='%23ff5500' d='M12 3a4 4 0 0 0-4 4v2H7a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-1V7a4 4 0 0 0-4-4Zm0 2a2 2 0 0 1 2 2v2h-4V7a2 2 0 0 1 2-2Z'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="main-bg text-white min-vh-100 d-flex flex-column">

    <div id="app-navbar"></div>

    <div id="auth-loading" class="container my-auto py-5 text-center">
        <div class="spinner-border text-orange" role="status"></div>
    </div>

    <main class="container py-5 auth-content d-none flex-grow-1" style="max-width: 900px;">

        <!-- Cartão do Jogador -->
        <div class="card card-custom card-static p-4 mb-4 animate-in">
            <div class="card-body">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <div class="icon-badge" style="width: 56px; height: 56px; font-size: 1.5rem;"><i class="bi bi-dribbble"></i></div>
                        <div>
                            <div class="badge bg-orange-subtle text-orange px-2 py-1 rounded-pill fw-bold text-uppercase small mb-1">Basquete</div>
                            <h2 class="fw-black text-uppercase mb-0 lh-1" id="jogador-nome"></h2>
                            <p class="text-secondary mb-0" id="jogador-info"></p>
                        </div>
                    </div>
                    <div class="stat-box p-3 text-center">
                        <div class="rotulo">OVR</div>
                        <div class="valor" id="jogador-ovr">0</div>
                    </div>
                </div>
                <div class="row g-3">
                    <div class="col-6 col-md" data-attr="arremesso">
                        <div class="d-flex justify-content-between small mb-1"><span class="text-secondary">ARREMESSO</span><span class="fw-bold" data-valor></span></div>
                        <div class="progress" style="height: 6px; background: rgba(255,255,255,0.08);"><div class="progress-bar bg-orange" data-barra></div></div>
                    </div>
                    <div class="col-6 col-md" data-attr="finalizacao">
                        <div class="d-flex justify-content-between small mb-1"><span class="text-secondary">FINALIZAÇÃO</span><span class="fw-bold" data-valor></span></div>
                        <div class="progress" style="height: 6px; background: rgba(255,255,255,0.08);"><div class="progress-bar bg-orange" data-barra></div></div>
                    </div>
                    <div class="col-6 col-md" data-attr="passe">
                        <div class="d-flex justify-content-between small mb-1"><span class="text-secondary">PASSE</span><span class="fw-bold" data-valor></span></div>
                        <div class="progress" style="height: 6px; background: rgba(255,255,255,0.08);"><div class="progress-bar bg-orange" data-barra></div></div>
                    </div>
                    <div class="col-6 col-md" data-attr="defesa">
                        <div class="d-flex justify-content-between small mb-1"><span class="text-secondary">DEFESA</span><span class="fw-bold" data-valor></span></div>
                        <div class="progress" style="height: 6px; background: rgba(255,255,255,0.08);"><div class="progress-bar bg-orange" data-barra></div></div>
                    </div>
                    <div class="col-6 col-md" data-attr="fisico">
                        <div class="d-flex justify-content-between small mb-1"><span class="text-secondary">FÍSICO</span><span class="fw-bold" data-valor></span></div>
                        <div class="progress" style="height: 6px; background: rgba(255,255,255,0.08);"><div class="progress-bar bg-orange" data-barra></div></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sem temporada ainda -->
        <div id="bloco-sem-temporada" class="text-center d-none animate-in animate-in-delay-1">
            <p class="text-secondary mb-3">Ainda não simulou a sua temporada de 82 jogos.</p>
            <button id="btn-simular" class="btn btn-orange fw-bold text-uppercase px-4 py-2">
                <i class="bi bi-play-fill me-1"></i> Simular Temporada
            </button>
        </div>

        <!-- Resultado da temporada -->
        <div id="bloco-temporada" class="d-none animate-in animate-in-delay-1">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                <h4 class="fw-bold text-uppercase mb-0 d-flex align-items-center gap-2">
                    <span class="icon-badge" style="width: 34px; height: 34px; font-size: 0.95rem;"><i class="bi bi-graph-up"></i></span>
                    Temporada Regular
                </h4>
                <button id="btn-simular-novamente" class="btn btn-outline-orange btn-sm fw-semibold">
                    <i class="bi bi-arrow-clockwise me-1"></i> Simular Novamente
                </button>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-4 col-md-2"><div class="stat-box p-3 text-center h-100"><div class="rotulo">Vitórias</div><div class="valor" id="r-vitorias"></div></div></div>
                <div class="col-4 col-md-2"><div class="stat-box p-3 text-center h-100"><div class="rotulo">Derrotas</div><div class="valor" id="r-derrotas"></div></div></div>
                <div class="col-4 col-md-2"><div class="stat-box p-3 text-center h-100"><div class="rotulo">PPG</div><div class="valor" id="r-pts"></div></div></div>
                <div class="col-4 col-md-2"><div class="stat-box p-3 text-center h-100"><div class="rotulo">RPG</div><div class="valor" id="r-reb"></div></div></div>
                <div class="col-4 col-md-2"><div class="stat-box p-3 text-center h-100"><div class="rotulo">APG</div><div class="valor" id="r-ast"></div></div></div>
                <div class="col-4 col-md-2"><div class="stat-box p-3 text-center h-100"><div class="rotulo">STL / BLK</div><div class="valor fs-5" id="r-defesa"></div></div></div>
            </div>

            <div class="text-center mb-4">
                <span id="r-classificacao" class="badge px-3 py-2 fs-6 me-2"></span>
                <span id="r-premio" class="badge bg-orange-subtle text-orange px-3 py-2 fs-6 d-none"><i class="bi bi-star-fill me-1"></i><span></span></span>
            </div>

            <h5 class="fw-bold text-uppercase mb-3 d-flex align-items-center gap-2">
                <i class="bi bi-card-list text-orange"></i> Log de Jogos
            </h5>
            <div class="table-responsive card card-custom card-static p-2" style="max-height: 400px; overflow-y: auto;">
                <table class="table table-dark-custom table-sm align-middle mb-0">
                    <thead>
                        <tr class="text-secondary small text-uppercase">
                            <th>#</th><th>Adversário</th><th>Res.</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-jogos"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="app-footer"></div>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="../js/database.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/nba-teams.js"></script>
    <script src="../js/simulation.js"></script>
    <script>
        montarLayoutApp({
            acoes: [
                { tag: "a", href: "basquete-draft.html", icon: "bi-arrow-repeat", label: "Trocar Jogador" },
                { tag: "a", href: "index.html", icon: "bi-house-fill", label: "Início", ocultarMobile: true }
            ]
        });

        let uidAtual = null;
        let jogadorAtual = null;
        let timeAtual = null;

        function renderJogador() {
            document.getElementById("jogador-nome").textContent = jogadorAtual.nome;
            document.getElementById("jogador-info").textContent = `${jogadorAtual.posicao} • ${jogadorAtual.timeNome}`;
            document.getElementById("jogador-ovr").textContent = jogadorAtual.ovr;

            document.querySelectorAll("[data-attr]").forEach((el) => {
                const chave = el.getAttribute("data-attr");
                const valor = jogadorAtual.attrs[chave];
                el.querySelector("[data-valor]").textContent = valor;
                el.querySelector("[data-barra]").style.width = valor + "%";
            });
        }

        function renderTemporada(temp) {
            document.getElementById("bloco-sem-temporada").classList.add("d-none");
            document.getElementById("bloco-temporada").classList.remove("d-none");

            document.getElementById("r-vitorias").textContent = temp.vitorias;
            document.getElementById("r-derrotas").textContent = temp.derrotas;
            document.getElementById("r-pts").textContent = temp.medias.pts;
            document.getElementById("r-reb").textContent = temp.medias.reb;
            document.getElementById("r-ast").textContent = temp.medias.ast;
            document.getElementById("r-defesa").textContent = `${temp.medias.stl} / ${temp.medias.blk}`;

            const badgeClass = temp.classificado ? "bg-success" : "bg-secondary";
            document.getElementById("r-classificacao").className = `badge px-3 py-2 fs-6 me-2 ${badgeClass}`;
            document.getElementById("r-classificacao").textContent = temp.classificado ? "Classificado para os Playoffs" : "Fora dos Playoffs";

            const premioEl = document.getElementById("r-premio");
            if (temp.premio) {
                premioEl.querySelector("span").textContent = temp.premio;
                premioEl.classList.remove("d-none");
            } else {
                premioEl.classList.add("d-none");
            }

            const corpo = document.getElementById("tabela-jogos");
            corpo.innerHTML = "";
            temp.jogos.forEach((j, i) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${i + 1}</td><td>${j.adversario}</td>
                    <td class="${j.resultado === "V" ? "text-success" : "text-danger"} fw-bold">${j.resultado}</td>
                    <td>${j.pts}</td><td>${j.reb}</td><td>${j.ast}</td><td>${j.stl}</td><td>${j.blk}</td>`;
                corpo.appendChild(tr);
            });
        }

        function simular() {
            const btn1 = document.getElementById("btn-simular");
            const btn2 = document.getElementById("btn-simular-novamente");
            [btn1, btn2].forEach((b) => { if (b) b.disabled = true; });

            const resultado = simularTemporadaBasquete(jogadorAtual, timeAtual);
            renderTemporada(resultado);

            db.collection("users").doc(uidAtual).set({ basketball: { temporada: resultado } }, { merge: true })
                .finally(() => { [btn1, btn2].forEach((b) => { if (b) b.disabled = false; }); });
        }

        exigirLogin((user) => {
            uidAtual = user.uid;
            db.collection("users").doc(user.uid).get().then((doc) => {
                const dados = doc.exists ? doc.data() : {};
                if (!dados.basketball) {
                    window.location.href = "basquete-draft.html";
                    return;
                }
                jogadorAtual = dados.basketball;
                timeAtual = NBA_TEAMS.find((t) => t.id === jogadorAtual.timeId);
                renderJogador();

                if (jogadorAtual.temporada) {
                    renderTemporada(jogadorAtual.temporada);
                } else {
                    document.getElementById("bloco-sem-temporada").classList.remove("d-none");
                }
            });
        });

        document.getElementById("btn-simular").addEventListener("click", simular);
        document.getElementById("btn-simular-novamente").addEventListener("click", simular);
    </script>
</body>
</html>
